name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify committed redirect data
        run: |
          test -f data/__default.help || { echo "::error::data/__default.help missing - run rdap-tld-redirect-gen and commit it"; exit 1; }
          compgen -G "data/tld_redirect_*.template" > /dev/null || { echo "::error::no data/tld_redirect_*.template committed"; exit 1; }

      - name: Resolve icann-rdap dev SHA
        id: rdapref
        run: |
          sha="$(git ls-remote https://github.com/icann/icann-rdap.git dev | cut -f1)"
          test -n "$sha" || { echo "::error::could not resolve icann-rdap dev SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved icann-rdap dev SHA: $sha"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ICANN_RDAP_REF=${{ steps.rdapref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
