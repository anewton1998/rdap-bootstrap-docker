[package]
name = "rdap-tld-redirect-gen"
version = "0.1.0"
edition = "2021"
description = "Generate RDAP 307 redirect templates for TLDs missing from the IANA bootstrap"
license = "MIT"

# The icann crates are pinned to the `dev` branch so the generated redirect
# template format matches the `rdap-srv` binary built by the Docker image
# (which also builds from `dev`).
[dependencies]
icann-rdap-srv = { git = "https://github.com/icann/icann-rdap", branch = "dev", default-features = false, features = ["memory"] }
icann-rdap-client = { git = "https://github.com/icann/icann-rdap", branch = "dev" }
icann-rdap-common = { git = "https://github.com/icann/icann-rdap", branch = "dev" }

clap = { version = "4", features = ["std", "derive", "env"] }
futures = "0.3"
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
